# Remote session overrides. Motion waypoints/safety remain in robot_task.yaml.
# 中间点一/二、拍照 tool0 位姿及倒序返回均只在主配置维护，此处不再复制。
# 此入口等待麒麟 start；检测后停在拍照位，收到 go_home 才走中间点返回。
base_config_file: robot_task.yaml
# Kylin PC address; HK binds locally to all interfaces, not to this remote IP.
# receiver_ip 是远端麒麟；hk_bind_ip 是机器人本机监听，不是相机位姿或安装坐标。
receiver_ip: 169.254.199.250
hk_bind_ip: 0.0.0.0
