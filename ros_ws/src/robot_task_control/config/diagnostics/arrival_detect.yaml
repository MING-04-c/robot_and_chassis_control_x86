# Arrival diagnostic: secure the chassis; do not run the main task concurrently.
# Joint angles and Cartesian RPY: degrees. Cartesian XYZ: metres.
# Device, capture and force limits are inherited from config/robot_task.yaml.
travel: [-45.0, 15.0, -71.0, 4.4, 148.0, 75.0]
detection_ready: [-45.0, 0.0, 0.0, 0.0, 90.0, 0.0]

workflow:
  name: arrival_detect
  auto_start: true  # Start after device readiness checks and safety interlocks permit.
  arm_postures_before_chassis: true
  device_check_timeout_sec: 120.0
  device_ready_stable_sec: 1.0
  steps:
  - name: to_transition
    action: arm_posture
    posture: detection_ready
    step_timeout_sec: 600.0
  - name: to_camera_via
    action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 1.0
    arrival_tolerance: 0.005
    arrival_orientation_tolerance_deg: 1.0
    after_arrival_delay_sec: 0.5
    step_timeout_sec: 180.0
    target_pose:
      position_mode: absolute
      position: [0.150, 0.530, 0.810]
      orientation: [75.0, 20.0, 170.0]
  - name: to_camera_intermediate
    action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 1.0
    arrival_tolerance: 0.005
    arrival_orientation_tolerance_deg: 1.0
    after_arrival_delay_sec: 0.5
    step_timeout_sec: 180.0
    target_pose:
      position_mode: absolute
      position: [0.300, 0.410, 0.795]
      orientation: [-90.0, 45.0, -45.0]
  - name: to_photo_pose
    action: arm_move
    control_mode: moveit
    frame_id: base_link
    end_effector_frame: tool0
    max_position_distance: 1.0
    arrival_tolerance: 0.005
    arrival_orientation_tolerance_deg: 1.0
    after_arrival_delay_sec: 0.5
    step_timeout_sec: 180.0
    target_pose:
      position_mode: absolute
      position: [0.375, 0.360, 0.590]
      orientation: [-175.0, 0.0, -90.0]
  - name: capture_and_thickness
    action: camera_detection
    step_timeout_sec: 1200.0
  - name: return_transition
    action: arm_posture
    posture: detection_ready
    step_timeout_sec: 600.0
  - name: return_travel
    action: arm_posture
    posture: travel
    step_timeout_sec: 600.0

camera_detection_task:
  ros__parameters:
    target_source: local
    camera_points_mm: [-10.0, -10.0, 130.0]  # TEST point in camera frame, millimetres; verify before touch.
