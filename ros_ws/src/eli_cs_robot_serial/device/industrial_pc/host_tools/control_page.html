<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麒麟 · 机器人任务控制</title><style>
:root{font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#e9edf5;background:#10141c}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}.sub{color:#9ca9bd;font-size:14px}.pill{border-radius:30px;background:#293240;padding:8px 14px}.ok{background:#123c34;color:#7ee2c0}.bad{background:#4b252a;color:#ffb1b5}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:24px}.card{background:#1b222e;border:1px solid #303a4a;border-radius:18px;padding:22px}.card h2{margin:0 0 18px;font-size:17px}.phase{font-size:32px;font-weight:700;margin-bottom:10px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#141b25;border-radius:12px;padding:13px}.metric label{display:block;color:#98a8bd;font-size:12px;margin-bottom:5px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{border:0;border-radius:12px;padding:14px;color:white;background:#3565d8;font:inherit;font-weight:650;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.42;cursor:not-allowed}.danger{background:#b9464c}.secondary{background:#3a4657}input{background:#111822;border:1px solid #506076;color:white;padding:13px;border-radius:10px;width:100%;font:inherit}.file-row{display:flex;gap:10px}.file-row button{white-space:nowrap}.chat{display:flex;flex-direction:column;gap:10px;max-height:350px;overflow:auto}.bubble{padding:11px 14px;border-radius:13px;background:#293445;white-space:pre-wrap;word-break:break-word}.bubble.me{align-self:flex-end;background:#264d8b}.bubble.err{background:#633038}small{color:#a9b6c7}.wide{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.file-row{flex-direction:column}}
</style></head><body><main><header><div><h1>机器人任务控制</h1><div class="sub">麒麟工控机 · 本机控制台</div></div><span id="connection" class="pill bad">连接中</span></header><div class="grid"><section class="card"><h2>当前任务</h2><div id="phase" class="phase">等待状态</div><div class="meta"><div class="metric"><label>工作流</label><span id="workflow">—</span></div><div class="metric"><label>步骤</label><span id="step">—</span></div><div class="metric"><label>电量</label><span id="battery">未知</span></div><div class="metric"><label>充电</label><span id="charging">未知</span></div><div class="metric"><label>采集批次</label><span id="run">—</span></div><div class="metric"><label>已完成轮数</label><span id="cycles">—</span></div></div><p id="fault" class="sub"></p></section><section class="card"><h2>一键控制</h2><div class="controls"><button data-action="start">启动任务</button><button data-action="detect">采图并检测</button><button data-action="go_home" class="secondary">返回充电</button><button data-action="stop" class="danger">中止任务</button></div><p class="sub">操作回执只表示机器人已受理。请看左侧阶段确认执行进度。</p></section><section class="card wide"><h2>发送本轮检测点</h2><div class="file-row"><input id="resultFile" placeholder="麒麟本机真实结果 JSON 文件的绝对路径" aria-label="检测结果文件路径"><button id="sendPoints">发送检测点</button></div><p class="sub">仅在 WAIT_RESULT 阶段发送；文件必须对应本轮照片清单哈希。页面不会生成或复用检测坐标。</p></section><section class="card wide"><h2>通信记录</h2><div id="chat" class="chat" aria-live="polite"></div></section></div></main><script>
const TOKEN='__CONTROL_TOKEN__';const $=id=>document.getElementById(id);let state=null,busy=false,lastPhase='';function say(msg,kind=''){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=new Date().toLocaleTimeString()+'  '+msg;$('chat').prepend(b)}function txt(id,value){$(id).textContent=value??'—'}function render(s){state=s;const connected=s.channels?.control?.state==='connected'&&!!s.robot_status;const c=$('connection');c.textContent=connected?'通信正常':'通信断开 / 等待机器人';c.className='pill '+(connected?'ok':'bad');const r=s.robot_status||{},t=r.task?.data||{},d=r.camera_detection?.data||{};txt('phase',d.oline_mode?d.state:t.phase||'等待状态');txt('workflow',t.workflow);txt('step',t.step_index==null?'—':`${t.step_index+1} / ${t.step_count??'?'}`);txt('battery',r.chassis_power?.battery_percent==null?'未知':r.chassis_power.battery_percent+'%');txt('charging',r.chassis_power?.charging==null?'未知':r.chassis_power.charging?'充电中':'未充电');txt('run',d.run_id);txt('cycles',d.completed_cycles);txt('fault',t.failure_reason||r.abnormal_status?.active_faults?.map(x=>x.message).join('；')||'');const phase=d.oline_mode?d.state:t.phase;if(phase&&phase!==lastPhase){say('机器人阶段：'+phase);lastPhase=phase}document.querySelectorAll('[data-action]').forEach(b=>{const a=b.dataset.action;b.disabled=busy||!connected||(a==='detect'&&!['WAIT_DETECT','WAIT_NEXT'].includes(d.state))||(a==='go_home'&&!['WAIT_DETECT','WAIT_NEXT'].includes(d.state))});$('sendPoints').disabled=busy||!connected||d.state!=='WAIT_RESULT'}async function api(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':TOKEN},body:JSON.stringify(data)});const body=await res.json();if(!res.ok)throw Error(body.error||'请求失败');return body}async function act(action){if(busy)return;if(action==='stop'&&!confirm('确认中止当前任务？中止不会自动返航。'))return;if(action==='go_home'&&!confirm('确认请求返回充电？请核对当前检测已完成并回位。'))return;busy=true;render(state||{});say('发送：'+({start:'启动任务',detect:'采图并检测',go_home:'返回充电',stop:'中止任务'}[action]),'me');try{const out=await api('/api/action',{action});say((out.response.ok?'已受理':'机器人拒绝')+' · '+(out.response.reason||out.response.disposition||'请等待状态更新')+' · ID '+out.message_id,out.response.ok?'':'err')}catch(e){say('发送失败：'+e.message,'err')}finally{busy=false;if(state)render(state)}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('sendPoints').onclick=async()=>{if(busy)return;const file=$('resultFile').value.trim();if(!file)return say('请填写本机结果文件路径','err');if(!confirm('确认该文件使用本轮真实照片与深度生成的坐标？'))return;busy=true;render(state||{});say('发送检测点：'+file,'me');try{const out=await api('/api/points',{file});say((out.response.ok?'已受理':'机器人拒绝')+' · '+(out.response.reason||out.response.disposition||'请等待检测状态')+' · ID '+out.message_id,out.response.ok?'':'err')}catch(e){say('发送失败：'+e.message,'err')}finally{busy=false;if(state)render(state)}};async function poll(){try{const res=await fetch('/api/state',{cache:'no-store'});if(!res.ok)throw Error('状态服务异常');render(await res.json())}catch(e){$('connection').textContent='页面服务异常';$('connection').className='pill bad'}}poll();setInterval(poll,2000);
</script></body></html>
